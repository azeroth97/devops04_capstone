server:
  port: 8080

spring:
  application:
    name: scoreboard

  datasource:
    url: jdbc:postgresql://database:5432/scoreboard
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
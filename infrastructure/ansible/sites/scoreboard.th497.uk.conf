server {
	listen 80;
	listen [::]:80;
	server_name scoreboard.th497.uk;
	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name scoreboard.th497.uk;

	ssl_certificate /etc/nginx/ssl/th497.uk.crt;
	ssl_certificate_key /etc/nginx/ssl/th497.uk.key;

	location / {
		proxy_pass  http://0.0.0.0:3000;
		include proxy_params;
	}
}
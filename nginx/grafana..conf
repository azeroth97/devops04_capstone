server {
  listen 80;
  listen [::]:80;
  server_name grafana.th497.uk;
  return 301  https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;

  server_name grafana.th497.uk;

  ssl_certificate /etc/nginx/ssl/th497.uk.crt;
  ssl_certificate_key /etc/nginx/ssl/th497.uk.key;

  location / {
    proxy_pass  http://0.0.0.0:3000;
    include proxy_params;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
